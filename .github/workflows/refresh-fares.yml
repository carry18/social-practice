name: 刷新12306票价库

on:
  schedule:
    - cron: '0 1 * * 1'        # 每周一 09:00（北京时间）自动刷新（无人维护时票价也不过期）
  workflow_dispatch:            # 需要时在 Actions 页面手动点 "Run workflow"
# 注意：不再用 push 触发——每次推送都跑一次会和 Pages 构建抢队列

concurrency:
  group: refresh-fares
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 联网刷新票价（14天窗口二等座最高价）
        run: python3 fare_query.py --update fares.json --days 14
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fares.json station_codes.json
          git diff --cached --quiet && echo "票价无变化" && exit 0
          git commit -m "chore: 自动刷新12306票价 ($(date +%F))"
          git push
