name: 部署网站到 SCF（国内可访问镜像）

# 触发时机：
# 1. 人工 push（排除票价机器人的 fares.json 提交——由下面的 workflow_run 接力）；
# 2. 「刷新12306票价库」成功跑完（机器人用 GITHUB_TOKEN push 不触发 push 事件）；
# 3. Actions 页面手动运行。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'fares.json'
      - 'station_codes.json'
  workflow_run:
    workflows: ['刷新12306票价库']
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 始终取 main 最新（含票价机器人刚提交的 fares.json）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tencentcloud-sdk-python-scf
      - name: 打包并更新 SCF 函数代码
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: python3 .github/scf-site/deploy.py
